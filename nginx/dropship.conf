# /etc/nginx/sites-available/dropship.conf
# Sample Hostinger VPS nginx config — reverse-proxies your domain → Next.js on :3001
#
# After editing:
#   sudo ln -s /etc/nginx/sites-available/dropship.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS with certbot:
#   sudo certbot --nginx -d dropship.example.com

server {
    listen 80;
    server_name dropship.example.com;   # ← change to your domain

    # increase if you upload large images / CSV imports
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / streaming
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout                 60s;
    }
}
